[project]
name = "eln-ops-mcp"
version = "0.1.0"
description = "ELN 运维 MCP Server：只读巡检 + 需审批的修复动作"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eln_ops_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
